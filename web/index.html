<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOQIX AI</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="aurora" aria-hidden="true"><i class="a1"></i><i class="a2"></i><i class="a3"></i></div>

<header class="topbar glass">
  <div class="logo">TOQIX<span>AI</span></div>
  <div class="auth-area" id="auth-area"></div>
</header>

<main>
  <section id="agent-panel" class="agent glass hidden">
    <div class="agent-head">
      <div class="agent-title">TOQIX Agent</div>
      <button type="button" id="new-series" class="mini-btn">New series</button>
    </div>
    <div class="chips scroll" id="series-strip"></div>
    <div id="bible" class="bible hidden"></div>
    <div id="chat" class="chat"></div>
    <div class="agent-input-row">
      <input id="agent-input" type="text" placeholder="Talk to the agent…" autocomplete="off">
      <button id="agent-send" class="primary" type="button">Send</button>
    </div>
    <div class="chips quick-chips">
      <button type="button" class="chip" data-quick="Start a series">Start a series</button>
      <button type="button" class="chip" data-quick="Next part">Next part</button>
      <button type="button" class="chip" data-quick="Status">Status</button>
      <button type="button" class="chip" data-quick="Parts">Parts</button>
    </div>
  </section>

  <section class="feed-wrap">
    <h2 class="feed-title" id="feed-title">Creations</h2>
    <div id="feed" class="feed"></div>
  </section>
  <footer>TOQIX AI</footer>
</main>

<div class="bottom-dock">
  <div class="dock-bar">
    <div class="seg view-seg" id="view-seg">
      <span class="seg-thumb" id="view-thumb"></span>
      <button type="button" data-view="studio" class="active">Studio</button>
      <button type="button" data-view="agent">Agent</button>
    </div>
  </div>

<section id="composer" class="composer glass">
  <textarea id="prompt" rows="1"
    placeholder="Describe anything… a panda astronaut planting a flag on the moon"></textarea>

  <div class="style-row">
    <span class="opt-label" id="chips-label">Style</span>
    <div class="chips scroll" id="styles"></div>
  </div>

  <div class="controls">
    <div class="seg" id="kind-seg">
      <span class="seg-thumb" id="seg-thumb"></span>
      <button type="button" data-kind="video" class="active">Video</button>
      <button type="button" data-kind="image">Image</button>
      <button type="button" data-kind="audio">Audio</button>
    </div>

    <div class="opt-line" id="media-opts">
      <label class="dur"><span class="opt-label">Ratio</span>
        <select id="aspect"></select>
      </label>
      <label class="dur" id="duration-wrap"><span class="opt-label">Length</span>
        <select id="duration">
          <option value="2">2s</option>
          <option value="3" selected>3s</option>
          <option value="4">4s</option>
          <option value="5">5s</option>
        </select>
      </label>
    </div>

    <button id="generate" class="primary">Generate</button>
  </div>
  <p id="msg" class="msg"></p>
</section>
</div>

<div id="lightbox" class="lightbox hidden" role="dialog" aria-modal="true">
  <div class="lb-backdrop" id="lb-backdrop"></div>
  <button id="lb-prev" class="lb-nav prev" type="button" aria-label="Previous">&#8249;</button>
  <figure class="lb-stage">
    <div id="lb-media" class="lb-media"></div>
    <figcaption class="lb-caption">
      <div id="lb-prompt" class="lb-prompt"></div>
      <div id="lb-meta" class="lb-meta"></div>
    </figcaption>
  </figure>
  <button id="lb-next" class="lb-nav next" type="button" aria-label="Next">&#8250;</button>
  <div class="lb-actions">
    <a id="lb-download" class="lb-btn" href="#" download>Download</a>
    <button id="lb-close" class="lb-btn" type="button">Close &#10005;</button>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
