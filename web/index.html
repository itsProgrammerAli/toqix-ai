<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOQIX AI — Socho. Bolo. Ban Gaya.</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <div class="logo">TOQIX<span>AI</span></div>
  <div class="tagline">Socho. Bolo. Ban Gaya.</div>
</header>

<main>
  <section class="composer">
    <textarea id="prompt" rows="3"
      placeholder="Apna idea likho… e.g. ek billi barish mein bhaag rahi hai — or: a panda astronaut planting a flag on the moon"></textarea>

    <div class="seg" id="kind-seg">
      <button type="button" data-kind="video" class="active">Video</button>
      <button type="button" data-kind="image">Image</button>
      <button type="button" data-kind="audio">Audio</button>
    </div>

    <div class="chips" id="styles"></div>

    <div class="opt-line" id="media-opts">
      <div class="chips" id="aspects"></div>
      <label class="dur" id="duration-wrap">Duration
        <select id="duration">
          <option value="2">2s</option>
          <option value="3" selected>3s</option>
          <option value="4">4s</option>
          <option value="5">5s</option>
        </select>
      </label>
    </div>

    <button id="generate" class="primary">Generate</button>
    <p id="msg" class="msg"></p>
  </section>

  <section class="feed-wrap">
    <div id="feed" class="feed"></div>
  </section>
</main>

<footer>TOQIX AI · Socho. Bolo. Ban Gaya.</footer>

<script src="/static/app.js"></script>
</body>
</html>
